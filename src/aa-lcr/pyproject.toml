[project]
name = "harbor-aa-lcr-adapter"
version = "0.1.0"
description = "Harbor adapter for aa-lcr"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub",
    "pandas",
]

# Flat-layout adapter (run_adapter.py at root); not an installable package —
# uv provisions the dependencies above and runs the script directly.
[tool.uv]
package = false
