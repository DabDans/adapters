[project]
name = "harbor-dabstep-adapter"
version = "0.1.0"
description = "Harbor adapter for dabstep"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "pandas",
]

# Flat-layout adapter (run_adapter.py at root); not an installable package —
# uv provisions the dependencies above and runs the script directly.
[tool.uv]
package = false
